name: 构建懒人包（Windows / Linux）

# 手动触发，或推 v* tag 时自动构建并挂到 Release
on:
  workflow_dispatch:
    inputs:
      core_version:
        description: "esp32 core 版本"
        default: "3.3.11"
      prebuilt:
        description: "顺带编译两版预编译固件"
        type: boolean
        default: true
  push:
    tags: ["v*"]

env:
  CORE_VERSION: ${{ github.event.inputs.core_version || '3.3.11' }}
  ARDUINO_CLI_VERSION: "1.1.1"
  # Windows 上让 Python 走 UTF-8，否则脚本里的 ✔ / → 会 UnicodeEncodeError
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装助手依赖
        shell: pwsh
        run: pip install -r pc_app/requirements.txt pyinstaller

      - name: 下载 arduino-cli (Windows)
        shell: pwsh
        run: |
          $ver = $env:ARDUINO_CLI_VERSION
          # 直接用官方下载地址（不查 API，避免匿名 API 限流）；失败才用带 token 的 API 兜底
          $url = "https://github.com/arduino/arduino-cli/releases/download/v$ver/arduino-cli_${ver}_Windows_64bit.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile cli.zip
          } catch {
            Write-Host "直接下载失败，改用 API 查找资源：$_"
            $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" } `
              "https://api.github.com/repos/arduino/arduino-cli/releases/tags/v$ver"
            $asset = $rel.assets | Where-Object { $_.name -match 'Windows_64bit\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw "找不到 arduino-cli $ver 的 Windows 包" }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile cli.zip
          }
          Expand-Archive cli.zip -DestinationPath tools/arduino-cli -Force

      - name: 安装 esp32 core（按 S3 裁剪前的完整安装）
        shell: pwsh
        run: |
          $data = "$pwd/arduino-data-stage"
          $user = "$pwd/arduino-user-stage"
          $cli  = "$pwd/tools/arduino-cli/arduino-cli.exe"
          $env:ARDUINO_DIRECTORIES_DATA = $data
          $env:ARDUINO_DIRECTORIES_USER = $user
          & $cli core update-index
          & $cli core install "esp32:esp32@$env:CORE_VERSION"

      - name: 组装懒人包（含预编译固件）
        if: ${{ github.event.inputs.prebuilt != 'false' }}
        shell: pwsh
        run: |
          python tools/make_bundle.py --out bundle `
            --from-data "$pwd/arduino-data-stage" `
            --cli "$pwd/tools/arduino-cli/arduino-cli.exe" `
            --prebuilt

      - name: 组装懒人包（跳过预编译固件）
        if: ${{ github.event.inputs.prebuilt == 'false' }}
        shell: pwsh
        run: |
          python tools/make_bundle.py --out bundle `
            --from-data "$pwd/arduino-data-stage" `
            --cli "$pwd/tools/arduino-cli/arduino-cli.exe"

      - name: 把助手打成 exe（免装 Python）
        shell: pwsh
        run: |
          $app = "bundle/app/pcapp_dumbversion"
          $paths = "bundle/src/GP-Combine/pc_app"
          pyinstaller --noconfirm --clean --onedir --name GP-Combine `
            --paths $paths --collect-all PIL --collect-all serial `
            --distpath bundle/app --workpath build/pyi --specpath build/pyi `
            "$app/main.py"
          # 启动器改成直接跑 exe（用数组写文件，避免 here-string 缩进问题）
          $bat = @(
            '@echo off',
            'setlocal',
            'set "HERE=%~dp0"',
            'set "GPCOMBINE_BUNDLE=%HERE%"',
            '"%HERE%app\GP-Combine\GP-Combine.exe" --bundle "%HERE%" %*',
            'endlocal'
          )
          Set-Content -Path "bundle/Start-GP-Combine.bat" -Value $bat -Encoding ASCII

      - name: 打包 zip
        shell: pwsh
        run: |
          # 7z 比 Compress-Archive 快很多，压缩率也高（1.6GB → ~700MB）
          7z a -mx=5 -mmt=on GP-Combine-lazy-windows.zip .\bundle\* | Out-Null
          (Get-FileHash GP-Combine-lazy-windows.zip -Algorithm SHA256).Hash | Out-File GP-Combine-lazy-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GP-Combine-lazy-windows
          path: |
            GP-Combine-lazy-windows.zip
            GP-Combine-lazy-windows.zip.sha256
          retention-days: 14

      - name: 挂到 Release（推 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GP-Combine-lazy-windows.zip
            GP-Combine-lazy-windows.zip.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装助手依赖
        run: pip install -r pc_app/requirements.txt

      - name: 下载 arduino-cli (Linux)
        run: |
          ver=$ARDUINO_CLI_VERSION
          url="https://github.com/arduino/arduino-cli/releases/download/v${ver}/arduino-cli_${ver}_Linux_64bit.tar.gz"
          if ! curl -fsSL -o cli.tar.gz "$url"; then
            echo "直接下载失败，改用 API 查找资源"
            url=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  "https://api.github.com/repos/arduino/arduino-cli/releases/tags/v${ver}" \
                  | grep -o '"browser_download_url": *"[^"]*Linux_64bit\.tar\.gz"' | head -1 \
                  | sed 's/.*"\(https[^"]*\)"/\1/')
            [ -n "$url" ] || { echo "找不到 arduino-cli ${ver} 的 Linux 包"; exit 1; }
            curl -fsSL -o cli.tar.gz "$url"
          fi
          mkdir -p tools/arduino-cli && tar -xzf cli.tar.gz -C tools/arduino-cli

      - name: 安装 esp32 core
        run: |
          export ARDUINO_DIRECTORIES_DATA="$PWD/arduino-data-stage"
          export ARDUINO_DIRECTORIES_USER="$PWD/arduino-user-stage"
          ./tools/arduino-cli/arduino-cli core update-index
          ./tools/arduino-cli/arduino-cli core install "esp32:esp32@${CORE_VERSION}"

      - name: 组装懒人包（含预编译固件）
        if: ${{ github.event.inputs.prebuilt != 'false' }}
        run: |
          python3 tools/make_bundle.py --out bundle \
            --from-data "$PWD/arduino-data-stage" \
            --cli "$PWD/tools/arduino-cli/arduino-cli" \
            --prebuilt

      - name: 组装懒人包（跳过预编译固件）
        if: ${{ github.event.inputs.prebuilt == 'false' }}
        run: |
          python3 tools/make_bundle.py --out bundle \
            --from-data "$PWD/arduino-data-stage" \
            --cli "$PWD/tools/arduino-cli/arduino-cli"

      - name: 打包 tar.gz
        run: |
          tar -czf GP-Combine-lazy-linux.tar.gz -C . bundle
          sha256sum GP-Combine-lazy-linux.tar.gz > GP-Combine-lazy-linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GP-Combine-lazy-linux
          path: |
            GP-Combine-lazy-linux.tar.gz
            GP-Combine-lazy-linux.tar.gz.sha256
          retention-days: 14

      - name: 挂到 Release（推 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GP-Combine-lazy-linux.tar.gz
            GP-Combine-lazy-linux.tar.gz.sha256
